<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Climate Risk Atlas — 5T Sports Group</title>
<meta name="description" content="Climate hazard exposure across North American professional sports venues" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="alternate icon" href="assets/favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- ===== TOP MASTHEAD ===== -->
  <header class="masthead">
    <div class="masthead-brand">
      <button class="icon-btn rail-toggle" id="btnMenu" aria-label="Toggle controls">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <span class="brand-mark">5T</span>
      <div class="brand-text">
        <h1>Climate&nbsp;Risk&nbsp;Atlas</h1>
        <p>Hazard exposure across North American professional sports venues</p>
      </div>
    </div>
    <div class="masthead-actions">
      <button class="ghost-btn" id="btnExportPNG">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>PNG</span>
      </button>
      <button class="ghost-btn" id="btnExportData">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>CSV</span>
      </button>
      <button class="ghost-btn" id="btnHazardList" aria-label="Toggle venue list">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Venue List</span>
      </button>
    </div>
  </header>

  <!-- ===== CONTROL RAIL ===== -->
  <aside class="control-rail" id="controlRail">

    <div class="rail-scroll">

      <section class="control-group search-group">
        <h2>Search</h2>
        <div class="search-box">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Team or venue name…" autocomplete="off" />
          <button class="search-clear" id="searchClear" aria-label="Clear search">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <div class="search-results" id="searchResults"></div>
        </div>
      </section>

      <section class="control-group">
        <h2>League</h2>
        <div class="chip-row wrap" id="leagueChips"></div>
      </section>

      <section class="control-group">
        <h2>Hazards</h2>
        <div class="chip-row wrap" id="hazardChips"></div>
      </section>

      <section class="control-group">
        <h2>Threshold</h2>
        <div class="segmented" id="thresholdSeg">
          <button data-val="all" class="active">All</button>
          <button data-val="1">Low+</button>
          <button data-val="2">Moderate+</button>
          <button data-val="3">High</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Min. Hazards <span class="hint">(at threshold)</span></h2>
        <div class="segmented" id="minHazardSeg">
          <button data-val="1" class="active">1+</button>
          <button data-val="2">2+</button>
          <button data-val="3">3+</button>
        </div>
      </section>

      <section class="control-group">
        <h2>View</h2>
        <div class="segmented" id="viewSeg">
          <button data-val="2d" class="active">2D</button>
          <button data-val="3d">3D</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Basemap</h2>
        <div class="segmented" id="basemapSeg">
          <button data-val="light" class="active">Light</button>
          <button data-val="satellite">Satellite</button>
        </div>
      </section>

    </div>

    <div class="rail-legend">
      <h2>Risk Level</h2>
      <ul class="legend-list">
        <li><i style="background:#3fae7a"></i>Negligible</li>
        <li><i style="background:#e8b84b"></i>Low</li>
        <li><i style="background:#e8823d"></i>Moderate</li>
        <li><i style="background:#c23b3b"></i>High</li>
      </ul>
      <p class="legend-status" id="legendStatus">Showing —</p>
    </div>

  </aside>

  <!-- ===== MAP ===== -->
  <main class="map-wrap">
    <div id="map"></div>

    <div class="map-scrim-top"></div>

    <div class="zoom-caption" id="zoomCaption"></div>
  </main>

  <!-- ===== VENUE LIST DRAWER ===== -->
  <aside class="venue-drawer" id="venueDrawer">
    <div class="drawer-head">
      <h2 id="drawerTitle">Venues</h2>
      <button class="icon-btn drawer-close" id="closeDrawer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer-list" id="drawerList"></div>
  </aside>

  <!-- popup template lives entirely in JS -->

</div>

<script src="js/data-loader.js"></script>
<script src="js/app.js"></script>
</body>
</html>
